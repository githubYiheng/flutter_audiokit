name: flutter_audiokit_workspace
publish_to: none

environment:
  sdk: ^3.5.0

workspace:
  - packages/flutter_audiokit
  - packages/flutter_audiokit_platform_interface
  - packages/flutter_audiokit_ios
  - example

dev_dependencies:
  melos: ^7.0.0

melos:
  repository: https://github.com/user/flutter_audiokit

  command:
    bootstrap:
      usePubspecOverrides: true

    version:
      linkToCommits: true

  scripts:
    analyze:
      exec: dart analyze --fatal-infos
      description: Run dart analyze in all packages.

    format:
      exec: dart format --set-exit-if-changed .
      description: Check formatting in all packages.

    test:
      exec: flutter test
      description: Run tests in all packages.
      packageFilters:
        dirExists: test

    pigeon:
      exec: dart run pigeon --input pigeons/messages.dart
      description: Generate Pigeon platform channel code.
      packageFilters:
        fileExists: pigeons/messages.dart
