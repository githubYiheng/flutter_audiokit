name: flutter_audiokit_ios
description: iOS implementation of flutter_audiokit using AudioKit.
version: 0.1.0
homepage: https://github.com/user/flutter_audiokit

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

flutter:
  plugin:
    implements: flutter_audiokit
    platforms:
      ios:
        pluginClass: FlutterAudioKitPlugin
        dartPluginClass: FlutterAudioKitIOS

dependencies:
  flutter:
    sdk: flutter
  flutter_audiokit_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^22.7.0
